name: hyjs
services:
  mysql:
    image: mysql:8.4
    container_name: hyjs-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hyjs
      MYSQL_USER: hyjs
      MYSQL_PASSWORD: ${HYJS_MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${HYJS_MYSQL_ROOT_PASSWORD:?required}
    command: [--innodb-buffer-pool-size=128M, --max-connections=100]
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    image: hyjs-game:current
    container_name: hyjs-game
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HYJS_UPSTREAM_PORT:?required}:${HYJS_HTTP_PORT:?required}
      - ${HYJS_TCP_PORT:?required}:${HYJS_TCP_PORT:?required}
    environment:
      HYJS_MYSQL_HOST: mysql:3306
      HYJS_MYSQL_USER: hyjs
      HYJS_MYSQL_DATABASE: hyjs
      HYJS_MYSQL_PASSWORD: ${HYJS_MYSQL_PASSWORD:?required}
      HYJS_ADMIN_ASSETS: /app/admin-web
      HYJS_CORS_ORIGINS: ${HYJS_ADMIN_ORIGIN:?required},${HYJS_API_ORIGIN:?required}
      HYJS_TRUSTED_PROXIES: ${HYJS_TRUSTED_PROXIES:-}
      GOMEMLIMIT: 768MiB
    volumes:
      - ./logs:/app/logs
    command: [--env, test, --bind, 0.0.0.0, --advertise-host, "${HYJS_PUBLIC_HOST:?required}", --http-port, "${HYJS_HTTP_PORT:?required}", --tcp-port, "${HYJS_TCP_PORT:?required}", --tables, /app/tables, --enable-test-payments, --enable-local-wallet]
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
