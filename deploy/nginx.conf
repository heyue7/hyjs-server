upstream hyjs_game_upstream {
    server 127.0.0.1:${HYJS_UPSTREAM_PORT};
    keepalive 16;
}
server {
    listen ${HYJS_ADMIN_PORT};
    server_name _;
    client_max_body_size 16m;
    location = / { return 302 /admin/; }
    location = /admin { return 302 /admin/; }
    location /admin/ {
        proxy_pass http://hyjs_game_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
    location / { return 404; }
}
server {
    listen ${HYJS_HTTP_PORT};
    server_name _;
    client_max_body_size 16m;
    # Only client contracts are public; loopback admin/test tools stay private.
    location ~ ^/(sao/?$|notices$|health$|client-update/(status|ack)$|game-account/|game-feedback/|game-guide/|instance-lock/(state|set)$|king-recruit/(worlds|select)$|voice/|world-boss/|local-wallet/) {
        proxy_pass http://hyjs_game_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
